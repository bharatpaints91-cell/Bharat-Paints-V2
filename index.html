<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Bharat Paints — Paint Advisor</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --saffron:#E8541A;--saffron2:#B83E0E;--saffron-light:#FDF0EB;
  --green:#1A6B3C;--navy:#1A2340;--gold:#C9891A;
  --gray:#6B7280;--border:#E5E7EB;--wa:#25D366;--white:#fff;
  --shadow:0 4px 24px rgba(26,35,64,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#FFF7F3,#F0F7F3 60%,#FFF7F3);min-height:100vh;display:flex;flex-direction:column;align-items:center;}

.header{width:100%;background:var(--navy);padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(26,35,64,.22);position:sticky;top:0;z-index:100;}
.logo-box{width:44px;height:44px;border-radius:10px;background:white;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.logo-box img{width:100%;height:100%;object-fit:contain;}
.hd-text h1{font-size:15px;font-weight:700;color:white;}
.hd-text p{font-size:10.5px;color:rgba(255,255,255,.6);}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.online-pill{background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.3);padding:3px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.online-txt{font-size:10.5px;color:rgba(255,255,255,.8);}
.wa-hdr{background:var(--wa);color:white;font-size:11px;font-weight:600;padding:6px 11px;border-radius:20px;text-decoration:none;display:flex;align-items:center;gap:4px;white-space:nowrap;}

.chat-wrap{width:100%;max-width:700px;flex:1;padding:0 0 130px;}
.messages{padding:16px 12px 0;display:flex;flex-direction:column;gap:12px;}
.msg{display:flex;gap:9px;align-items:flex-end;}
.msg.bot{flex-direction:row;}
.msg.user{flex-direction:row-reverse;}
.av{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.av img{width:100%;height:100%;object-fit:contain;background:white;}
.bubble{max-width:83%;padding:11px 14px;line-height:1.57;font-size:14px;border-radius:16px;}
.msg.bot .bubble{background:white;color:var(--navy);border-bottom-left-radius:4px;box-shadow:var(--shadow);border:1px solid var(--border);}
.msg.user .bubble{background:linear-gradient(135deg,var(--saffron),var(--saffron2));color:white;border-bottom-right-radius:4px;}
.bubble ul{padding-left:18px;margin-top:5px;}
.bubble ul li{margin-bottom:3px;}
.tag{display:inline-block;background:var(--saffron-light);color:var(--saffron2);font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;margin-bottom:6px;}
.wa-btn{display:inline-flex;align-items:center;gap:5px;margin-top:9px;background:var(--wa);color:white;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:8px;text-decoration:none;}
.ask-price-btn{display:inline-block;margin-top:8px;background:var(--saffron-light);color:var(--saffron2);font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;border:1px solid #f5c4b0;}
.price-table{width:100%;border-collapse:collapse;margin-top:7px;font-size:12.5px;}
.price-table th{background:var(--navy);color:white;padding:6px 9px;text-align:left;}
.price-table td{padding:5px 9px;border-bottom:1px solid var(--border);}
.price-table tr:nth-child(even) td{background:#f8fafc;}
.pnote{font-size:11.5px;color:var(--gray);margin-top:5px;}
.link-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.link-pill{background:#EAF5EE;color:var(--green);font-size:12px;font-weight:500;padding:4px 10px;border-radius:20px;text-decoration:none;}
.prod-list{margin-top:6px;}
.prod-item{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:12.5px;margin-bottom:4px;}

.typing{display:flex;gap:5px;padding:9px 13px;align-items:center;}
.typing span{width:7px;height:7px;background:var(--gray);border-radius:50%;animation:bounce 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}

.chips-wrap{padding:9px 12px 3px;display:flex;flex-wrap:wrap;gap:7px;}
.chip{background:white;border:1.5px solid var(--saffron);color:var(--saffron2);font-size:12.5px;font-weight:500;padding:6px 13px;border-radius:30px;cursor:pointer;transition:all .16s;font-family:'Poppins',sans-serif;}
.chip:hover{background:var(--saffron);color:white;}

.input-area{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);padding:9px 12px 13px;display:flex;gap:8px;align-items:center;box-shadow:0 -4px 24px rgba(26,35,64,.08);}
.input-area input{flex:1;padding:11px 15px;border:1.5px solid var(--border);border-radius:30px;font-family:'Poppins',sans-serif;font-size:14px;color:var(--navy);outline:none;background:#F3F4F6;transition:border-color .18s;}
.input-area input:focus{border-color:var(--saffron);background:white;}
.input-area input::placeholder{color:var(--gray);}
.send-btn{width:43px;height:43px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),var(--saffron2));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(232,84,26,.35);transition:transform .15s;flex-shrink:0;}
.send-btn:hover{transform:scale(1.08);}
.send-btn svg{width:18px;height:18px;fill:white;}
#msgEnd{height:1px;}
@media(max-width:480px){.bubble{font-size:13.5px;}.chip{font-size:12px;padding:5px 11px;}.wa-hdr span{display:none;}}
</style>
</head>

function addChips(arr){
  const old=document.getElementById('chips');if(old)old.remove();
  const w=document.createElement('div');w.className='chips-wrap';w.id='chips';
  arr.forEach(l=>{const c=document.createElement('button');c.className='chip';c.textContent=l;c.onclick=()=>chipClick(l);w.appendChild(c);});
  msgsEl.insertBefore(w,document.getElementById('msgEnd'));scrollDown();
}

function renderAnswer(ans){
  let h='';
  if(ans.tag) h+='<span class="tag">'+ans.tag+'</span><br>';
  if(ans.text) h+=ans.text+'<br>';
  if(ans.details&&ans.details.length){h+='<ul>';ans.details.forEach(d=>h+='<li>'+d+'</li>');h+='</ul>';}
  if(ans.products&&ans.products.length){
    h+='<table class="price-table"><thead><tr><th>Product</th><th>Size</th><th>Rate</th></tr></thead><tbody>';
    ans.products.forEach(p=>h+='<tr><td>'+p.name+'</td><td>'+p.size+'</td><td><strong>'+p.price+'</strong></td></tr>');
    h+='</tbody></table>';
  }
  if(ans.productNames&&ans.productNames.length){
    h+='<div class="prod-list">';
    ans.productNames.forEach(n=>h+='<div class="prod-item">'+n+'</div>');
    h+='</div>';
  }
  if(ans.note) h+='<div class="pnote">'+ans.note+'</div>';
  if(ans.links&&ans.links.length){h+='<div class="link-row">';ans.links.forEach(l=>h+='<a class="link-pill" href="'+l.url+'" target="_blank">'+l.label+'</a>');h+='</div>';}
  if(ans.type==='faq'||ans.type==='product_info'||ans.type==='service'){
    if(ans.type!=='price') h+='<br><span class="ask-price-btn" onclick="sendQ(\'price list\')">💰 Ask for Prices</span>';
  }
  if(ans.cta) h+='<br><a class="wa-btn" href="'+ans.cta.url+'" target="_blank">'+ans.cta.label+'</a>';
  return h;
}

async function askBot(query){
  showTyping();
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});
    const d=await r.json();
    hideTyping();
    if(d.answer){addMsg(renderAnswer(d.answer),'bot');addChips(CHIPS);}
    else{addMsg('Something went wrong. <a class="wa-btn" href="'+WA+'?text=Hi!" target="_blank">💬 WhatsApp Us</a>','bot');}
  }catch(e){
    hideTyping();
    addMsg('Could not connect. <a class="wa-btn" href="'+WA+'?text=Hi!" target="_blank">💬 WhatsApp Us</a>','bot');
  }
}

function chipClick(l){addMsg(l,'user');askBot(l);}
function sendQ(q){inputEl.value=q;handleSend();}
function handleSend(){const t=inputEl.value.trim();if(!t)return;inputEl.value='';addMsg(t,'user');askBot(t);}
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter')handleSend();});

window.onload=()=>{
  addMsg('<span class="tag">👋 Namaste!</span><br>Welcome to <strong>Bharat Paints, Karnal.</strong><br><br>I can help with products, prices, waterproofing, painting service, colour consultancy and more.<br><br><em>What do you need today?</em>','bot');
  addChips(CHIPS);
};
</script>
